<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      内容安全策略：桌宠页面不加载任何外部资源、不发起任何网络请求。
      余额等数据全部由主进程通过 IPC 推进来，所以这里可以收得很紧。

      connect-src 'self' 是必需的：动画清单（manifest.json）是用 fetch 读的，
      没有它会被 default-src 'none' 拦掉 —— 实测踩过这个坑（表现是窗口全透明空白，
      因为帧从未被设置）。'self' 在 file:// 下只允许读取同源本地文件，不放宽到网络。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>DSH Pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 舞台：整窗可拖拽。桌宠窗口很小且全被角色占据，所以拖拽区=整窗最自然。 -->
    <div id="stage" class="stage">
      <!-- 顶部气泡区：高度由主进程下发（固定像素，不随桌宠缩放）。 -->
      <div class="bubble-area">
        <div id="bubble" class="bubble" hidden><span id="bubble-text"></span></div>
      </div>

      <!--
        角色区：占据气泡区以下的全部空间。
        帧由 renderer.js 从 assets/animations/stand/frame_NN.webp 预加载后切换 src。
        素材画布是 864×1157（已裁掉透明留白），尺寸由渲染进程按主进程下发的
        角色宽度精确计算，不使用 object-fit，以免产生 letterbox 影响命中测试。
      -->
      <div id="character" class="character">
        <img id="frame" class="frame" alt="" draggable="false" />
      </div>

      <!--
        数值变化的浮出层（用户要求：好感/心情变动时要有可视化反馈）。

        为什么单独一层、且 `pointer-events: none`：
          · 它飘在角色上方，若参与命中测试会把"点脸"变成"点数字"；
          · 数字只是反馈，不该拦任何鼠标事件。
      -->
      <div id="float-layer" class="float-layer" aria-hidden="true"></div>

      <!--
        余额面板：**常驻**显示在桌宠下方（用户要求）。

        与属性面板是**两块独立的区域**：
          · 这块在 HTML 里位于角色区之后、属性面板之前，且窗口高度里
            为它单独预留了 BALANCE_ZONE_FONT_RATIO × 字号 的高度；
          · 属性面板也有自己单独预留的区域。
        两者由流布局排开 —— 所以属性面板显示时不会盖住它，也不需要在
        悬停时重新排版（那会抖）。
      -->
      <div id="balance-panel" class="balance-panel">
        <div class="balance-body">
          <div class="balance-main">
            <span class="balance-label">余额</span>
            <span id="balance-value" class="balance-value">--</span>
          </div>
          <!--
            说明文字（余额告急 / 取数失败 / 已过期）单独一行。
            ⚠️ 刻意**不放在 .balance-main 里**：那一行是 `align-items: baseline` 的，
            18px 的数字与 10px 的说明混排会互相撑高、容易溢出；
            分成两行后各自的高度都只由自己的字号决定，窗口窄时也不会挤爆。
          -->
          <span id="balance-note" class="balance-note"></span>
        </div>
      </div>

      <!--
        属性面板：光标悬停在桌宠上时显示，位置在桌宠**下方**。
        高度由主进程下发（见 STATS_ZONE_PX），且窗口尺寸里已经为它预留了空间，
        因此它不会盖住角色、也不会被角色盖住。
        后续属性往 stats-body 里加即可（高度比例要同步调 STATS_ZONE_FONT_RATIO）。
      -->
      <div id="stats-panel" class="stats-panel" hidden>
        <div class="stats-body">
          <!--
            好感值显示在心情值**上方**（用户要求）。
            爱心数量 = 好感等级（1~5），进度条 = 当前等级的阶段好感值进度，
            右侧数字 = 阶段好感值 / 该等级的阶段阈值。
          -->
          <div class="stat-row">
            <span class="stat-name">好感</span>
            <div class="stat-bar" role="progressbar" aria-label="好感值">
              <div id="affection-fill" class="stat-bar-fill affection"></div>
            </div>
            <span id="affection-value" class="stat-value">0/100</span>
          </div>
          <div id="affection-hearts" class="stat-note hearts">♥♡♡♡♡</div>

          <div class="stat-row">
            <span class="stat-name">心情</span>
            <div class="stat-bar" role="progressbar" aria-label="心情值">
              <div id="mood-fill" class="stat-bar-fill"></div>
            </div>
            <span id="mood-value" class="stat-value">100</span>
          </div>
          <div id="mood-tier" class="stat-note">心情很好</div>
        </div>
      </div>

      <div id="offline" class="offline" hidden>宿主离线</div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
