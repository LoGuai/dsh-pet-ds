# ============================================================================
# dsh-pet-ds 的 bundle patch —— 把桌宠插件挂进 DSH 的配置树
# ============================================================================
#
# DSH 启动时按 bundle 层栈把各插件的 patch 逐层叠加组成配置树，本文件是这一层。
#
#   · insert：向配置树里添加新的插件行（entry）
#   · id：行标识，patch 覆盖与插件管理页按它定位；生态约定要求与包名一致
#   · name：模块说明符，解析到本包的 main（lib 或 src/host/index.js）
#   · config 下的字段全部可省略，省略即用代码里的默认值
#
# 注意：`id:` 那一行不要写行尾注释，部分生态预检脚本用正则抓这一行的值。
#
# ============================================================================

- insert:
    - id: dsh-pet-ds
      name: 'dsh-pet-ds'
      config:
        # 回环状态接口的起始端口（只监听 127.0.0.1）；被占用时自动向后顺延。
        port: 47845
        # 桌宠窗口宽度（CSS 像素），高度按素材比例自动计算。
        size: 260
        # 宿主启动后自动把桌宠叫起来。
        autoStart: true
        # 启动延迟，避开宿主 boot 高峰。
        startDelayMs: 3000
        # 打印桌宠子进程输出，排障时改成 true。
        debug: false
        # 宿主卸载时是否顺手关掉桌宠。默认 false：桌宠是桌面常驻小玩意。
        stopOnUnload: false
        # 余额低于该值时桌宠下方的余额面板转为"告急"配色。
        lowBalanceThreshold: 10
        # 余额刷新与消费播报周期（秒）。用户指定 5 分钟 = 300 秒；下限 5。
        # 缓存时长与刷新周期共用这个值（分开设会在不一致时产生难查的问题）。
        refreshSeconds: 300
        # DeepSeek API 地址（自建或走代理时改这里）。
        apiBase: 'https://api.deepseek.com'
        # 读取 API Key 的凭据键名。需要在 DSH 里配置这个凭据，否则余额面板显示"未配置"。
        credential: 'DEEPSEEK_API_KEY'
        # 显式指定 Electron 可执行文件；留空则自动探测。
        # electronPath: 'C:\\path\\to\\electron.exe'
